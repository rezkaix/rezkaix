<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RezKai-X Risk Calculator</title>
  <style>
    body {
      background-color: #0e0e0e;
      font-family: 'Segoe UI', sans-serif;
      color: #f1f1f1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
    }
    .calculator {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 0 10px #000;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #0ff;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
      color: #ccc;
    }
    select, input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #2a2a2a;
      color: #fff;
      font-size: 16px;
      margin-bottom: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #0ff;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    .results {
      margin-top: 20px;
      font-size: 17px;
      background: #111;
      padding: 15px;
      border-radius: 8px;
    }
    .results div {
      margin: 8px 0;
    }
    .warn {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <h2>🎯 RezKai-X Risk Calculator</h2>

    <label>Trading Symbol</label>
    <select id="symbol">
      <option value="MNQ">MNQ</option>
      <option value="NQ">NQ</option>
      <option value="ES">ES</option>
      <option value="Micro ES">Micro ES</option>
      <option value="GC">GC</option>
      <option value="Micro GC">Micro GC</option>
    </select>

    <label>💥 Max Risk for the Day ($)</label>
    <input type="number" id="maxRisk" placeholder="e.g. 1450">

    <label>💰 Risk Per Trade ($)</label>
    <input type="number" id="riskPerTrade" placeholder="e.g. 600">

    <label>🛡️ Stop Loss (points)</label>
    <input type="number" id="slPoints" placeholder="e.g. 20">

    <button onclick="calculate()">Calculate</button>

    <div class="results" id="output"></div>
  </div>

  <script>
    const tickMap = {
      "MNQ": 0.5,
      "NQ": 2,
      "ES": 12.5,
      "Micro ES": 1.25,
      "GC": 10,
      "Micro GC": 1
    };

    function calculate() {
      const symbol = document.getElementById('symbol').value;
      const maxRisk = parseFloat(document.getElementById('maxRisk').value);
      const riskPerTrade = parseFloat(document.getElementById('riskPerTrade').value);
      const slPoints = parseFloat(document.getElementById('slPoints').value);
      const output = document.getElementById('output');
      const tickValue = tickMap[symbol];

      if (isNaN(maxRisk) || isNaN(riskPerTrade) || isNaN(slPoints)) {
        output.innerHTML = "<div class='warn'>❌ Please fill out all fields correctly.</div>";
        return;
      }

      if (slPoints > 70) {
        output.innerHTML = "<div class='warn'>❌ Stop Loss too large. No trade!</div>";
        return;
      }

      let rrr = 1;
      if (slPoints <= 21) rrr = 3;
      else if (slPoints <= 30) rrr = 2.5;
      else if (slPoints <= 45) rrr = 2;
      else if (slPoints <= 50) rrr = 1.5;
      else rrr = 1;

      const oneR = (maxRisk / 1); // Base 1R = Max Daily Risk
      const tp = riskPerTrade * rrr;
      const contracts = Math.floor(riskPerTrade / (slPoints * tickValue));
      const tpPoints = (tp / (contracts * tickValue)).toFixed(2);

      output.innerHTML = `
        <div>✅ <strong>Contracts:</strong> ${contracts}</div>
        <div>🎯 <strong>RRR:</strong> 1:${rrr}</div>
        <div>💰 <strong>Risk:</strong> $${riskPerTrade}</div>
        <div>📈 <strong>TP:</strong> ${tpPoints} pts = $${tp.toFixed(2)}</div>
      `;
    }
  </script>
</body>
</html>
