<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RezKai-X Risk Calculator</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 40px;
    }
    .calculator {
      background: #1c1c1c;
      border-radius: 10px;
      padding: 30px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 0 15px #000;
    }
    .calculator h2 {
      text-align: center;
      color: #00e7ff;
    }
    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }
    select,
    input[type="number"] {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      background: #2b2b2b;
      color: #fff;
      border: none;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #00faff;
      border: none;
      margin-top: 25px;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
    .result {
      margin-top: 25px;
      padding: 15px;
      background: #000;
      border-radius: 8px;
      font-size: 16px;
    }
    .highlight {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <h2>🎯 RezKai-X Risk Calculator</h2>

    <label>Trading Symbol</label>
    <select id="symbol">
      <option value="2">MNQ</option>
      <option value="20">NQ</option>
      <option value="50">ES</option>
      <option value="5">Micro ES</option>
      <option value="100">GC</option>
      <option value="10">Micro GC</option>
    </select>

    <label>🌟 Max Risk for the Day ($)</label>
    <input type="number" id="maxRisk" placeholder="e.g. 1450" />

    <label>🎯 Daily Target ($)</label>
    <input type="number" id="target" placeholder="e.g. 1800" />

    <label>📉 Stop Loss (points)</label>
    <input type="number" id="sl" placeholder="e.g. 12" />

    <button onclick="calculate()">Calculate</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function getRRR(sl) {
      if (sl <= 21) return 3;
      if (sl <= 30) return 2.5;
      if (sl <= 45) return 2;
      if (sl <= 50) return 1.5;
      if (sl <= 70) return 1;
      return 0;
    }

    function calculate() {
      const symbol = parseFloat(document.getElementById("symbol").value);
      const maxRisk = parseFloat(document.getElementById("maxRisk").value);
      const target = parseFloat(document.getElementById("target").value);
      const sl = parseFloat(document.getElementById("sl").value);

      if (!symbol || !maxRisk || !target || !sl) return;

      const rrr = getRRR(sl);

      if (rrr === 0) {
        document.getElementById("result").innerHTML = `❌ SL too high. Skip this trade.`;
        return;
      }

      const riskPerTrade = target / rrr;
      const contracts = Math.floor(riskPerTrade / (sl * symbol));
      const totalRisk = contracts * sl * symbol;
      const tp = sl * rrr;
      const tpMoney = contracts * tp * symbol;

      document.getElementById("result").innerHTML = `
        ✅ <span class="highlight">Contracts:</span> ${contracts}<br>
        🎯 <span class="highlight">RRR:</span> 1:${rrr}<br>
        💰 <span class="highlight">Risk:</span> $${totalRisk.toFixed(2)}<br>
        📈 <span class="highlight">TP:</span> ${tp.toFixed(2)} pts = $${tpMoney.toFixed(2)}
      `;
    }
  </script>
</body>
</html>
