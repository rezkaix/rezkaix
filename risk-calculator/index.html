<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RezKai-X Risk Calculator</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #1a1a1a;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 200, 0.1);
    }
    h2 {
      text-align: center;
      color: #00ffc8;
    }
    label {
      display: block;
      margin-top: 20px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 6px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: #00ffc8;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background-color: #111;
      border-left: 4px solid #00ffc8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Risk Calculator</h2>
    <label for="symbol">Trading Symbol:</label>
    <select id="symbol">
      <option value="MNQ">MNQ</option>
      <option value="NQ">NQ</option>
      <option value="ES">ES</option>
      <option value="MES">Micro ES</option>
      <option value="GC">GC</option>
      <option value="MGC">Micro GC</option>
    </select>

    <label for="maxRisk">Max Daily Risk ($):</label>
    <input type="number" id="maxRisk" placeholder="e.g. 1450" />

    <label for="slPoints">Stop Loss (points):</label>
    <input type="number" id="slPoints" placeholder="e.g. 22" />

    <button onclick="calculateRisk()">Calculate</button>

    <div class="result" id="resultBox" style="display: none;"></div>
  </div>

  <script>
    const tickValues = {
      MNQ: 2, // $2 per point
      NQ: 20,
      ES: 50,
      MES: 5,
      GC: 10,
      MGC: 1
    };

    function calculateRisk() {
      const symbol = document.getElementById("symbol").value;
      const maxRisk = parseFloat(document.getElementById("maxRisk").value);
      const slPoints = parseFloat(document.getElementById("slPoints").value);

      if (isNaN(maxRisk) || isNaN(slPoints) || maxRisk <= 0 || slPoints <= 0) {
        alert("Please enter valid risk and stop loss values.");
        return;
      }

      const tickValue = tickValues[symbol];
      const riskPerContract = slPoints * tickValue;
      const contracts = Math.floor(maxRisk / riskPerContract);
      const usedRisk = contracts * riskPerContract;

      const tp1 = usedRisk * 1; // RRR 1:1
      const tp2 = usedRisk * 2;
      const tp3 = usedRisk * 3;

      const result = `
        <strong>Symbol:</strong> ${symbol}<br>
        <strong>Stop Loss:</strong> ${slPoints} pts<br>
        <strong>Contracts:</strong> ${contracts}<br>
        <strong>Risk Used:</strong> $${usedRisk.toFixed(2)}<br>
        <strong>Target Profit (1:1):</strong> $${tp1.toFixed(2)}<br>
        <strong>Target Profit (1:2):</strong> $${tp2.toFixed(2)}<br>
        <strong>Target Profit (1:3):</strong> $${tp3.toFixed(2)}<br>
      `;

      const box = document.getElementById("resultBox");
      box.innerHTML = result;
      box.style.display = "block";
    }
  </script>
</body>
</html>
